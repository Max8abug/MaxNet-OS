name: Publish MaxNet OS release

on:
  pull_request:
    branches:
      - main
    paths:
      - "maxnet-os/**"
      - ".github/workflows/release-maxnet-os.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "maxnet-os/**"
      - ".github/workflows/release-maxnet-os.yml"

permissions:
  contents: read

concurrency:
  group: maxnet-os-release
  cancel-in-progress: false

jobs:
  launcher-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test MaxOS app launchers
        run: bash maxnet-os/tests/test-launchers.sh

      - name: Build and verify MaxOS package
        shell: bash
        run: |
          ./maxnet-os/package/build-deb.sh
          package="maxnet-os/dist/maxnet-os_$(tr -d '[:space:]' < maxnet-os/VERSION)_amd64.deb"
          test -s "$package"
          dependencies="$(dpkg-deb -f "$package" Depends)"
          grep -Fq 'celluloid | mpv' <<< "$dependencies"
          package_listing="$(dpkg-deb -c "$package")"
          grep -Fq 'usr/share/maxnet-os/maxos-intro.mp4' <<< "$package_listing"
          for size in 24x24 48x48 96x96; do
            grep -Fq "usr/share/icons/hicolor/$size/apps/maxnet-os-start-0-4-11.png" <<< "$package_listing"
          done
          if grep -Fq 'usr/share/icons/maxnet-os-start.svg' <<< "$package_listing"; then
            echo "The obsolete Start icon is still in the package." >&2
            exit 1
          fi

  build-and-release:
    needs: launcher-checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Choose release version
        id: release
        shell: bash
        run: |
          source_version="$(tr -d '[:space:]' < maxnet-os/VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$GITHUB_REF_NAME" = "v$source_version" || {
              echo "Tag $GITHUB_REF_NAME does not match MaxNet OS version $source_version" >&2
              exit 1
            }
            tag="$GITHUB_REF_NAME"
          else
            [[ "$GITHUB_REF_NAME" == "main" ]] || {
              echo "Automatic stable releases can only be created from main." >&2
              exit 1
            }
            [[ "$source_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
              echo "MaxNet OS version must be MAJOR.MINOR.PATCH." >&2
              exit 1
            }
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}+build.${GITHUB_RUN_NUMBER}"
            tag="v$version"
            printf '%s\n' "$version" > maxnet-os/VERSION
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        run: ./maxnet-os/package/build-deb.sh

      - name: Create package checksum
        working-directory: maxnet-os/dist
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: sha256sum "maxnet-os_${RELEASE_VERSION}_amd64.deb" > "maxnet-os_${RELEASE_VERSION}_amd64.deb.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping duplicate publication."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "maxnet-os/dist/maxnet-os_${RELEASE_VERSION}_amd64.deb" \
            "maxnet-os/dist/maxnet-os_${RELEASE_VERSION}_amd64.deb.sha256" \
            --target "$GITHUB_SHA" \
            --title "MaxNet OS ${RELEASE_VERSION}" \
            --generate-notes
